# ==============================================================================
# CONFIGURACIÓN DE KITTY - SPIDER-MAN 2099 // LYLA CYBER-HUD EDITION
# ==============================================================================

# --- Fuente Tipográfica ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Ventana y Márgenes (Optimizado para pantalla 1366x768) ---
window_padding_width 10
window_border_width  1.5pt
draw_minimal_borders yes
remember_window_size no
initial_window_width  104c
initial_window_height 28c
confirm_os_window_close 0
hide_window_decorations no

# --- Transparencia y Desenfoque (Efecto Holográfico 2099) ---
background_opacity 0.86
background_blur    28
dynamic_background_opacity yes

# --- Cursor y Estela de Energía Neón ---
cursor_shape beam
cursor_beam_thickness 2.2
cursor_trail 4
cursor_trail_decay 0.1 0.45
cursor #ff2a4b
cursor_text_color #090b12

# --- Barra de Pestañas (Estilo Alchemax 2099 Powerline) ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " 󱇪 {index}: {title} "

# --- Atajos Rápidos Cyber-HUD ---
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map f1               launch --type=tab --tab-title="LYLA HUD" /home/spider-man/.local/bin/spider-hud

# --- Rendimiento y Comportamiento ---
enable_audio_bell no
scrollback_lines 10000
mouse_hide_wait 3.0
url_style curly
url_color #00f0ff

# ==============================================================================
# PALETA DE COLORES: SPIDER-MAN 2099 // MIGUEL O'HARA CYBER-HUD
# ==============================================================================
background            #080a12
foreground            #d4e0ff
selection_background  #ff2a4b
selection_foreground  #ffffff

# Bordes de ventanas divididas (Carmesí 2099 activo / Azul Ciber inactivo)
active_border_color   #ff2a4b
inactive_border_color #0055aa

# Pestañas con estilo Spider-Man 2099 (Carmesí neón y Cian holográfico)
active_tab_background   #ff2a4b
active_tab_foreground   #ffffff
active_tab_font_style   bold
inactive_tab_background #0f1426
inactive_tab_foreground #00f0ff
tab_bar_background      #06080f

# --- Colores de Terminal (ANSI 16) ---
# Negro (Obsidian 2099)
color0 #090b12
color8 #444f7a

# Rojo (Crimson 2099 Talons)
color1 #ff2a4b
color9 #ff5370

# Verde (Bio-Genetic Sync)
color2  #00e676
color10 #69f0ae

# Amarillo (Alchemax Warning Gold)
color3  #ffc777
color11 #ffe082

# Azul (Miguel O'Hara Suit Blue)
color4  #0077ff
color12 #38bdf8

# Magenta (Multiverse Glitch Violet)
color5  #c084fc
color13 #e879f9

# Cian (LYLA Holographic Cyan)
color6  #00f0ff
color14 #84ffff

# Blanco (Web Silver)
color7  #d4e0ff
color15 #ffffff
