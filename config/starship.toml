# ==============================================================================
# CONFIGURACIÓN DE STARSHIP - SPIDER-MAN 2099 // LYLA CYBER-HUD EDITION
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "spiderman_2099"

format = """
[╭─](bold fg:red)\
[🕸 2099](bold fg:red bg:panel)\
[](fg:panel bg:blue)\
$os\
$username\
[](fg:blue bg:panel)\
$directory\
[](fg:panel)\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$java\
$c\
$cmd_duration\
$line_break\
[╰─](bold fg:red)[🕷](bold fg:cyan) $character"""

right_format = """$time"""

[palettes.spiderman_2099]
background = "#090b12"
panel      = "#14192b"
foreground = "#d4e0ff"
comment    = "#565f89"
red        = "#ff2a4b"
orange     = "#ff9e64"
yellow     = "#ffc777"
green      = "#4ade80"
cyan       = "#00f0ff"
blue       = "#0055aa"
purple     = "#c084fc"

[os]
disabled = false
style = "bold fg:cyan bg:blue"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇"
Ubuntu = ""
Linux  = ""

[username]
show_always = true
style_user = "bold fg:foreground bg:blue"
style_root = "bold fg:red bg:blue"
format = "[$user ]($style)"

[directory]
style = "bold fg:cyan bg:panel"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold fg:red"
symbol = "  "
format = "[$symbol$branch]($style) "

[git_status]
style = "bold fg:cyan"
format = "([$all_status$ahead_behind]($style) )"

[character]
success_symbol = "[❯](bold fg:red)[❯](bold fg:cyan)"
error_symbol = "[✗](bold fg:red)"

[cmd_duration]
min_time = 1_500
style = "bold fg:yellow"
format = "[⚡ $duration]($style) "

[time]
disabled = false
time_format = "%H:%M:%S"
style = "bold fg:comment"
format = "[\\[LYLA // $time\\]]($style)"
